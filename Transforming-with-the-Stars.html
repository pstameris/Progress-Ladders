const TOPICS=['Describing Rigid Transformations','Reflections on a Coordinate Grid','Translations on a Coordinate Grid','Rotations on a Coordinate Grid'];
const RUBRIC=[['I can identify if a translation, rotation, or reflection has occurred.','I can precisely describe each transformation using words such as left, right, clockwise, or counterclockwise and 90° or 180°.','I can precisely describe a sequence of translations, rotations, and reflections on two-dimensional figures.'],['I can reflect an image over the x- or y-axis.','I can reflect an image over the x- or y-axis and enter the coordinates of the corresponding points of the new image.','I can describe the effects of reflections on two-dimensional figures using coordinates. Example: (x, y) → (−x, y).'],['I can translate a shape on a coordinate grid.','I can translate a shape on a coordinate grid and correctly label the corresponding points of the image.','I can describe the effects of translations on two-dimensional figures using coordinates.'],['I can rotate a shape or a point on the shape 90° or 180° using transparent paper.','I can rotate a shape or a point on the shape 90° or 180° about the origin and draw and label the image.','Challenge: I can describe the effects of 90° or 180° rotations about the origin on two-dimensional figures using coordinate points.']];
const KEY='transforming-stars-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state&&Array.isArray(state.done)?state:{done:[0,0,0,0],seen:{}};state.seen=state.seen||{};let session=null,q=null,choice=null,plots=[],dragPoints=[],dragResult=null,correct=false,advanceTimer;const app=document.getElementById('app');const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[rand(0,a.length-1)];const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function tr(p,t){let[x,y]=p;switch(t.kind){case't':return[x+t.dx,y+t.dy];case'fx':return[x,-y];case'fy':return[-x,y];case'fv':return[2*t.k-x,y];case'fh':return[x,2*t.k-y];case'r90':return[-y,x];case'r270':return[y,-x];case'r180':return[-x,-y]}}function desc(t){return t.kind==='t'?'Translate '+[t.dx?`${Math.abs(t.dx)} units ${t.dx<0?'left':'right'}`:'',t.dy?`${Math.abs(t.dy)} units ${t.dy<0?'down':'up'}`:''].filter(Boolean).join(' and '):t.kind==='fx'?'Reflect over the x-axis':t.kind==='fy'?'Reflect over the y-axis':t.kind==='fv'?`Reflect over x = ${t.k}`:t.kind==='fh'?`Reflect over y = ${t.k}`:t.kind==='r90'?'Rotate 90° counterclockwise about the origin':t.kind==='r270'?'Rotate 90° clockwise about the origin':'Rotate 180° about the origin'}function rule(t){return t.kind==='t'?`(x, y) → (x ${t.dx<0?'−':'+'} ${Math.abs(t.dx)}, y ${t.dy<0?'−':'+'} ${Math.abs(t.dy)})`:t.kind==='fx'?'(x, y) → (x, −y)':t.kind==='fy'?'(x, y) → (−x, y)':t.kind==='fv'?`(x, y) → (${2*t.k} − x, y)`:t.kind==='fh'?`(x, y) → (x, ${2*t.k} − y)`:t.kind==='r90'?'(x, y) → (−y, x)':t.kind==='r270'?'(x, y) → (y, −x)':'(x, y) → (−x, −y)'}function transform(kind){return{kind,dx:pick([-5,-4,-3,-2,2,3,4,5]),dy:pick([-4,-3,-2,2,3,4]),k:pick([-2,-1,1,2])}}function type(t){return t.kind==='t'?'Translation':t.kind.startsWith('f')?'Reflection':'Rotation'}
function generate(topic,level){if(topic===1&&level===3)return generatePoint();for(let attempts=0;attempts<1000;attempts++){let base=topic===0?[rand(1,3),rand(1,3)]:[rand(-5,2),rand(-4,2)],p=topic===0?[base,[base[0]+rand(2,3),base[1]],[base[0],base[1]+rand(3,4)]]:[base,[base[0]+rand(2,4),base[1]+1],[base[0]+1,base[1]+rand(3,5)]],k=topic===0?(session&&session.topic===0?['t','fx',pick(['r90','r270','r180']),'fy',pick(['r90','r270','r180'])][session.turn%5]:pick(['t','fx','fy','r90','r180'])):topic===1?pick(['fx','fy']):topic===2?'t':level===3&&session?['r270','r90','r180'][session.turn%3]:pick(['r90','r270','r180']),t=transform(k),steps=[t];if(topic===0&&k==='t'){t.dx=pick([-6,-5,5,6]);t.dy=0;}if(topic===0&&level===3){let second=transform(k==='t'?pick(['fx','fy']):'t');if(second.kind==='t'){second.dx=pick([-3,-2,2,3]);second.dy=0;}steps.push(second);}if((topic===1&&level===2)||(topic===2&&level<=2)){const sx=pick([-1,1]),sy=pick([-1,1]),bx=rand(1,4),by=rand(1,4);p=[[bx,by],[bx+rand(2,4),by+1],[bx+1,by+rand(3,4)]].map(([x,y])=>[x*sx,y*sy]);}if(topic===3&&level<=2){const sx=pick([-1,1]),sy=pick([-1,1]),bx=rand(1,3),by=rand(1,3);p=[[bx,by],[bx+rand(2,3),by],[bx,by+rand(3,4)]].map(([x,y])=>[x*sx,y*sy]);}let mid=p.map(v=>tr(v,t)),target=mid.map(v=>steps.length===2?tr(v,steps[1]):v);if([...p,...mid,...target].some(v=>v.some(n=>Math.abs(n)>9)))continue;if(p.some((v,i)=>v[0]===target[i][0]&&v[1]===target[i][1]))continue;const signature=JSON.stringify([p,steps]);const key=topic+'-'+level;if((state.seen[key]||[]).includes(signature))continue;state.seen[key]=(state.seen[key]||[]).concat(signature).slice(-3000);save();let question={p,target,t,steps,mode:'plot',signature};if(topic===0){question.mode='choice';question.answer=level===1?type(t):steps.map(desc).join(', then ');let opts=level===1?['Translation','Reflection','Rotation']:level===2?[desc(t),...['t','fx','fy','r90','r270','r180'].filter(v=>v!==k).map(v=>desc({...t,kind:v}))]:[question.answer,steps.slice().reverse().map(desc).join(', then '),[steps[0],transform('r180')].map(desc).join(', then '),[transform('fy'),steps[1]].map(desc).join(', then ')];question.options=shuffle([...new Set(opts)]).slice(0,4);if(!question.options.includes(question.answer))question.options[0]=question.answer;question.options=shuffle(question.options)}else if(level===3){question.mode=topic===2?'translationRule':topic===3?'rotationRule':'coords';question.rules=shuffle([...new Set([rule(t),rule({...t,kind:'fx'}),rule({...t,kind:'fy'}),rule({...t,kind:'r90'}),rule({...t,kind:'r270'}),rule({...t,kind:'r180'}),rule({...t,dx:-t.dx,dy:-t.dy})])]);}return question}throw Error('Question generation failed')}
function home(){clearTimeout(advanceTimer);session=null;document.getElementById('awardCount').textContent=state.done.filter(v=>v===3).length+' / 4 trophies';app.innerHTML=`<section class="hero"><div class="ball" aria-hidden="true"></div><div class="eyebrow" style="margin-top:20px">Your next move is a winning move</div><h1>Transforming<br>with the <em>Stars</em></h1><p>Step onto the coordinate dance floor. Choose a rubric cell, master your moves, and dance your way to a mirror ball trophy.</p></section><div class="toolbar"><span class="pill">✦ Choose a rubric cell to see its streak goal</span><button class="secondary" id="reset">Reset progress</button></div><div class="tablewrap"><table><thead><tr><th>YOUR PROGRESS LADDER</th><th>LEVEL 1 · EARN AN 8</th><th>LEVEL 2 · EARN A 9</th><th>LEVEL 3 · EARN A 10</th></tr></thead><tbody>${TOPICS.map((name,i)=>`<tr><td class="topic"><small>CONCEPT ${i+1}</small><b>${name}</b>${state.done[i]===3?'<span>🏆 Mirror ball champion</span>':''}</td>${RUBRIC[i].map((text,j)=>{let complete=state.done[i]>j,locked=state.done[i]<j;return`<td><button class="cell ${complete?'complete':''}" data-topic="${i}" data-level="${j+1}" ${locked?'disabled':''}><span>${text}</span><span class="cell-goal">${i===3&&j<2?3:5} correct to complete${i===3&&j<2?' · 1 mistake forgiven per problem':''}</span><span class="status">${locked?'🔒 Complete Level '+j+' first':complete?'✓ '+(j+8)+' earned · Practice again':'✦ Take the floor →'}</span></button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="footer">Each topic has its own unlock path. Progress saves on this browser.<br>Pink = pre-image · Teal = image · All rotations are about the origin.</div>`;app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start(+b.dataset.topic,+b.dataset.level));document.getElementById('reset').onclick=()=>{if(confirm('Reset all earned paddles and trophies on this browser?')){state={done:[0,0,0,0],seen:{}};save();home()}}}
function start(topic,level){session={topic,level,count:0,errors:0,turn:-1};next()}function next(){session.turn++;if(perProblemForgiveness())session.problemErrors=0;q=generate(session.topic,session.level);choice=null;plots=[];dragPoints=q.p.map(p=>p.slice());dragResult=null;correct=false;render()}
function grid(){let lines='';const pos=([x,y])=>[220+x*21,220-y*21];for(let i=-10;i<=10;i++){let a=220+i*21;lines+=`<path d="M ${a} 10 V430 M10 ${a} H430" stroke="${i===0?'#63567a':'#ded8e9'}" stroke-width="${i===0?1.8:.7}"/>`;if(i!==0&&i%2===0)lines+=`<text x="${a}" y="237" text-anchor="middle" font-size="9" fill="#63567a">${i}</text><text x="207" y="${220-i*21+3}" text-anchor="end" font-size="9" fill="#63567a">${i}</text>`}function poly(points,color,labels){return`<polygon points="${points.map(v=>pos(v).join(',')).join(' ')}" fill="${color}30" stroke="${color}" stroke-width="2.8"/>`+points.map((v,i)=>{let[x,y]=pos(v);return`<circle cx="${x}" cy="${y}" r="4" fill="${color}"/><text x="${x+7}" y="${y-7}" font-size="12" font-weight="700" fill="#312348">${labels[i]}</text>`}).join('')}let visual=poly(q.p,'#b64b88',['A','B','C']);if(session.topic===0&&session.level===3)visual+=poly(q.p.map(v=>tr(v,q.steps[0])),'#c58d22',['A₁','B₁','C₁']);if(q.mode==='choice'||((q.mode==='coords'||q.mode==='translationRule')&&session.topic===2))visual+=poly(q.target,'#138c7b',['A′','B′','C′']);if(q.mode==='plot'&&!isDrag()&&plots.length)visual+=poly(plots,'#138c7b',session.level===2?['A′','B′','C′']:['','','']);if(q.t.kind==='fv'||q.t.kind==='fh'){let axis=220+(q.t.kind==='fv'?q.t.k:-q.t.k)*21;visual+=`<path d="${q.t.kind==='fv'?`M${axis} 10 V430`:`M10 ${axis} H430`}" stroke="#d59221" stroke-width="2.5" stroke-dasharray="6 4"/>`;}if(isDrag()){visual+=`<polygon id="dragTriangle" points="${dragPoints.map(v=>pos(v).join(',')).join(' ')}" fill="#138c7b20" stroke="#138c7b" stroke-width="2" stroke-dasharray="5 4"/>`;visual+=dragPoints.map((v,i)=>{let[x,y]=pos(v);return`<g class="drag-handle" data-vertex="${i}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="Drag ${['A′','B′','C′'][i]} to its ${session.topic===2?'translated':'reflected'} location. Arrow keys move one unit. Use Check my move to evaluate the transformation."><circle r="11" fill="#138c7b" stroke="white" stroke-width="2"/><text y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="white">${['A','B','C'][i]}</text></g>`}).join('');if(dragResult){let[a,b]=dragResult.points.map(pos);visual+=`<path d="M${a.join(' ')} L${b.join(' ')}" stroke="${dragResult.pending?'#84759f':dragResult.ok?'#138c7b':'#c55173'}" stroke-width="3" stroke-dasharray="4 3"/>`;}}return`<svg id="grid" class="grid" viewBox="0 0 440 440" role="img" aria-label="Coordinate grid from negative ten to ten with triangle ABC${q.mode==='choice'?' and transformed triangle A prime B prime C prime':''}">${lines}<text x="422" y="215" font-size="13" fill="#63567a">x</text><text x="226" y="19" font-size="13" fill="#63567a">y</text>${visual}</svg>`}
function render(){if(q.mode==='rotationRule'){renderRotationRule();return}if(q.mode==='translationRule'){renderTranslationRule();return}if(q.mode==='point'){renderPoint();return}let{topic,level,count}=session;let prompt=topic===0?(level===1?'Which transformation maps ABC to A′B′C′?':level===2?'Precisely describe the move from ABC to A′B′C′.':'Follow the two moves: pink ABC → gold A₁B₁C₁ → teal A′B′C′. Which sequence matches?'):(q.mode==='plot'||q.mode==='entry')?desc(q.t)+'.':topic===2?'Read the graph. Enter the image coordinates and choose the translation rule.':desc(q.t)+'. Enter the image coordinates and choose the rule.';app.innerHTML=`<div class="toolbar"><button class="secondary" id="back">← Rubric</button><span class="pill">Level ${level} · ${count} / ${streakGoal()} streak</span></div><div class="eyebrow">Concept ${topic+1} · Your ${level===1?'opening act':level===2?'encore':'finale'}</div><h2>${TOPICS[topic]}</h2><section class="streak-panel" aria-label="Correct answer streak"><div class="eyebrow">${streakGoal()} CORRECT TO COMPLETE · YOUR WINNING STREAK</div><div id="streakStars" class="streak-stars"></div><div id="streakPolicy" class="streak-policy"></div></section><div class="stage"><section class="card"><div id="graph">${grid()}</div><div class="legend"><span>● Pre-image ABC</span><span>● Image A′B′C′</span>${session.topic===0&&session.level===3?'<span style="color:#dfb658">● Intermediate image</span>':''}</div>${q.mode==='plot'?'<button class="secondary" id="clear">Clear plotted points</button>':''}</section><section class="card"><h2 style="font-size:25px">${prompt}</h2>${q.mode==='choice'?`<div class="options">${q.options.map((v,i)=>`<button class="choice" data-index="${i}">${v}</button>`).join('')}</div>`:(q.mode==='plot'||q.mode==='entry')?`<p id="plotHelp">${q.mode==='entry'?'Enter the x- and y-coordinates for A′, B′, and C′ below.':isDrag()?(session.level===2?`Drag A′, B′, and C′ to their ${topic===2?'translated':'reflected'} locations. Then type the coordinates for each point yourself. Check my move evaluates BOTH your points and your coordinates.`:`Drag each teal point from the pink pre-image to its ${topic===2?'translated':'reflected'} location. Press Check my move when all three points are ready.`):level===2?'Click the grid in order: A′, then B′, then C′.':'Click the grid to place the three image vertices in any order.'} ${q.mode==='entry'?'Press Check my move when all coordinates are ready.':'You can also enter coordinates below and check your move.'}</p><div class="inputs">${['A′','B′','C′'].map((v,i)=>`<label>${v} (<input aria-label="${v} x coordinate" type="number" id="x${i}" min="-10" max="10">,<input aria-label="${v} y coordinate" type="number" id="y${i}" min="-10" max="10">)</label>`).join('')}</div>`:`<div class="inputs">${['A′','B′','C′'].map((v,i)=>`<label>${v} (<input aria-label="${v} x coordinate" type="number" id="x${i}">,<input aria-label="${v} y coordinate" type="number" id="y${i}">)</label>`).join('')}</div><div class="rulebox"><label for="rule">Coordinate rule</label><br><select id="rule"><option value="">Choose a rule…</option>${q.rules.map((r,i)=>`<option value="${i}">${r}</option>`).join('')}</select></div>`}<div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="toolbar"><button class="primary" id="check">Check my move</button><button class="secondary" id="hint">Coach’s tip</button></div><div id="hintText" class="hint" hidden></div></section></div>`;updateStreak();document.getElementById('back').onclick=home;document.getElementById('check').onclick=check;document.getElementById('hint').onclick=()=>{let el=document.getElementById('hintText');el.hidden=false;el.textContent=topic===0?'Follow matching vertices. Translations slide, reflections flip, and rotations turn. For a sequence, the order matters.':topic===1?'A reflected point is the same distance from the mirror line on the opposite side. The other coordinate stays the same.':topic===2?'Add the horizontal change to every x-coordinate and the vertical change to every y-coordinate.':q.t.kind==='r180'?'For a 180° turn, both coordinates change sign.':'For 90° counterclockwise, (x, y) becomes (−y, x). For 90° clockwise, it becomes (y, −x).'};app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(correct)return;choice=+b.dataset.index;app.querySelectorAll('.choice').forEach(v=>v.classList.toggle('selected',v===b))});if(q.mode==='plot'){if(isDrag())bindDrag();else document.getElementById('grid').onclick=plot;document.getElementById('clear').onclick=()=>{if(correct)return;plots=[];if(isDrag()){dragPoints=q.p.map(p=>p.slice());dragResult=null;}for(let i=0;i<3;i++){document.getElementById('x'+i).value='';document.getElementById('y'+i).value=''}refreshGrid()};app.querySelectorAll('input').forEach(i=>i.oninput=()=>{if(isDrag()&&session.level===2)return;plots=[];for(let j=0;j<3;j++){let x=document.getElementById('x'+j).value,y=document.getElementById('y'+j).value;if(x===''||y==='')break;if(Math.abs(+x)>10||Math.abs(+y)>10)break;plots.push([+x,+y])}if(isDrag()&&session.level===1){for(let j=0;j<3;j++){let x=document.getElementById('x'+j).value,y=document.getElementById('y'+j).value;if(x!==''&&y!==''&&Math.abs(+x)<=10&&Math.abs(+y)<=10)dragPoints[j]=[+x,+y]}}refreshGrid()})}}
function refreshGrid(){document.getElementById('graph').innerHTML=grid();if(isDrag())bindDrag();else document.getElementById('grid').onclick=plot}function plot(e){if(correct||plots.length>=3)return;const svg=document.getElementById('grid'),point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const local=point.matrixTransform(svg.getScreenCTM().inverse());let p=[Math.round((local.x-220)/21),Math.round((220-local.y)/21)];if(p.some(v=>Math.abs(v)>10))return;plots.push(p);let i=plots.length-1;if(session.level===1){document.getElementById('x'+i).value=p[0];document.getElementById('y'+i).value=p[1]};refreshGrid()}
function normalizeRotationExpression(value){return value.toLowerCase().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/^\+([xy])$/,'$1')}function renderRotationRule(){const name=q.t.kind==='r270'?'90° clockwise':q.t.kind==='r90'?'90° counterclockwise':'180°';app.innerHTML=`<div class="toolbar"><button class="secondary" id="back">← Rubric</button><span class="pill">Level 3 · ${session.count} / 5 streak</span></div><div class="eyebrow">Concept 4 · Your finale</div><h2>Rotations: Create the Rule</h2><section class="streak-panel" aria-label="Correct answer streak"><div class="eyebrow">5 CORRECT TO COMPLETE · YOUR WINNING STREAK</div><div id="streakStars" class="streak-stars"></div><div id="streakPolicy" class="streak-policy"></div></section><section class="card"><h2 style="font-size:25px">Write the rule for a ${name} rotation about the origin.</h2><p>Study these three examples, then use x and y to write the rule.</p><div class="tablewrap"><table class="rotation-examples"><thead><tr><th>Original Image</th><th>Transformation</th><th>Rotated Image</th></tr></thead><tbody>${q.p.map((p,i)=>`<tr><td>${['A','B','C'][i]} (${p[0]}, ${p[1]})</td><td>${name}</td><td>${['A′','B′','C′'][i]} (${q.target[i][0]}, ${q.target[i][1]})</td></tr>`).join('')}</tbody></table></div><div class="rule-entry"><span>(x, y) → (</span><input id="ruleX" type="text" aria-label="First coordinate expression" autocomplete="off" autocapitalize="off" spellcheck="false"><span>,</span><input id="ruleY" type="text" aria-label="Second coordinate expression" autocomplete="off" autocapitalize="off" spellcheck="false"><span>)</span></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="toolbar"><button class="primary" id="check">Check my move</button><button class="secondary" id="hint">Coach’s tip</button></div><div id="hintText" class="hint" hidden></div></section>`;updateStreak();document.getElementById('back').onclick=home;document.getElementById('check').onclick=check;document.getElementById('hint').onclick=()=>{const hint=document.getElementById('hintText');hint.hidden=false;hint.textContent='Compare each original coordinate with its rotated coordinate. Do x and y swap places? Which signs change? Look for the same pattern in all three rows.'}}function matchesExpression(value,variable,change){const expression=value.toLowerCase().replace(/\s/g,'').replace(/[−–]/g,'-');const match=expression.match(/^([xy])(?:([+-])(\d+))?$/);if(!match||match[1]!==variable)return false;const amount=match[2]?(match[2]==='-'?-1:1)*Number(match[3]):0;return amount===change}function renderTranslationRule(){app.innerHTML=`<div class="toolbar"><button class="secondary" id="back">← Rubric</button><span class="pill">Level 3 · ${session.count} / ${streakGoal()} streak</span></div><div class="eyebrow">Concept 3 · Your finale</div><h2>Translations: Write the Rule</h2><section class="streak-panel" aria-label="Correct answer streak"><div class="eyebrow">${streakGoal()} CORRECT TO COMPLETE · YOUR WINNING STREAK</div><div id="streakStars" class="streak-stars"></div><div id="streakPolicy" class="streak-policy"></div></section><div class="stage"><section class="card">${grid()}<div class="legend"><span>● Pre-image ABC</span><span>● Image A′B′C′</span></div></section><section class="card"><h2 style="font-size:25px">Write the rule that maps ABC to A′B′C′.</h2><p>Use x in the first box and y in the second box. Include the horizontal and vertical changes.</p><div class="rule-entry"><span>(x, y) → (</span><input id="ruleX" type="text" aria-label="First coordinate expression using x" autocomplete="off" autocapitalize="off" spellcheck="false"><span>,</span><input id="ruleY" type="text" aria-label="Second coordinate expression using y" autocomplete="off" autocapitalize="off" spellcheck="false"><span>)</span></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="toolbar"><button class="primary" id="check">Check my move</button><button class="secondary" id="hint">Coach’s tip</button></div><div id="hintText" class="hint" hidden></div></section></div>`;updateStreak();document.getElementById('back').onclick=home;document.getElementById('check').onclick=check;document.getElementById('hint').onclick=()=>{const hint=document.getElementById('hintText');hint.hidden=false;hint.textContent='Follow one matching vertex. Right adds to x; left subtracts from x. Up adds to y; down subtracts from y. The same changes apply to every vertex.'}}function generatePoint(){const key='1-3-point';for(let attempt=0;attempt<1000;attempt++){const p=[pick([-1,1])*rand(1,30),pick([-1,1])*rand(1,30)],t=transform(session&&session.topic===1&&session.level===3?(session.turn%2===0?'fx':'fy'):pick(['fx','fy'])),letter=pick(['Z','P','Q','R','S','T','M','N']),signature=JSON.stringify([p,t.kind,letter]);if((state.seen[key]||[]).includes(signature))continue;state.seen[key]=(state.seen[key]||[]).concat(signature).slice(-5000);save();return{mode:'point',p:[p],target:[tr(p,t)],t,steps:[t],letter,signature}}throw Error('Point generation failed')}function renderPoint(){const {level,count}=session;const axis=q.t.kind==='fx'?'x':'y',point=q.p[0];app.innerHTML=`<div class="toolbar"><button class="secondary" id="back">← Rubric</button><span class="pill">Level 3 · ${count} / ${streakGoal()} streak</span></div><div class="eyebrow">Concept 2 · Your finale</div><h2>Reflections: Point Coordinates</h2><section class="streak-panel" aria-label="Correct answer streak"><div class="eyebrow">${streakGoal()} CORRECT TO COMPLETE · YOUR WINNING STREAK</div><div id="streakStars" class="streak-stars"></div><div id="streakPolicy" class="streak-policy"></div></section><section class="card point-question"><div class="eyebrow">One point. One reflection.</div><h2>If point ${q.letter} (${point[0]}, ${point[1]}) is reflected over the ${axis}-axis, what would the coordinates of point ${q.letter}′ be?</h2><div class="inputs"><label>${q.letter}′ (<input id="x0" type="number" aria-label="${q.letter} prime x coordinate">,<input id="y0" type="number" aria-label="${q.letter} prime y coordinate">)</label></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="toolbar"><button class="primary" id="check">Check my move</button><button class="secondary" id="hint">Coach’s tip</button></div><div id="hintText" class="hint" hidden></div></section>`;updateStreak();document.getElementById('back').onclick=home;document.getElementById('check').onclick=check;document.getElementById('hint').onclick=()=>{const hint=document.getElementById('hintText');hint.hidden=false;hint.textContent=axis==='x'?'Reflecting over the x-axis keeps x the same and changes the sign of y.':'Reflecting over the y-axis keeps y the same and changes the sign of x.'}}function isDrag(){return session&&(session.topic===1||session.topic===2)&&(session.level===1||session.level===2)}function samePoint(a,b){return a[0]===b[0]&&a[1]===b[1]}function moveHandle(i,p){dragPoints[i]=p;const handle=document.querySelector(`[data-vertex="${i}"]`);handle.setAttribute('transform',`translate(${220+p[0]*21} ${220-p[1]*21})`);document.getElementById('dragTriangle').setAttribute('points',dragPoints.map(v=>[220+v[0]*21,220-v[1]*21].join(',')).join(' '));if(session.level===1){document.getElementById('x'+i).value=p[0];document.getElementById('y'+i).value=p[1]}}function finishDrag(i,start){dragResult={points:[start,dragPoints[i].slice()],pending:true};refreshGrid();const f=document.getElementById('feedback');f.style.color='var(--muted)';f.textContent=session.level===2?'Point moved. Place all three points and type their coordinates, then press Check my move.':'Point moved. Place all three image points, then press Check my move.'}function bindDrag(){document.querySelectorAll('.drag-handle').forEach(handle=>{const i=+handle.dataset.vertex;let start=null;handle.onpointerdown=e=>{if(correct)return;e.preventDefault();start=dragPoints[i].slice();handle.setPointerCapture(e.pointerId)};handle.onpointermove=e=>{if(!start||correct)return;const svg=document.getElementById('grid'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const loc=pt.matrixTransform(svg.getScreenCTM().inverse());moveHandle(i,[Math.max(-10,Math.min(10,Math.round((loc.x-220)/21))),Math.max(-10,Math.min(10,Math.round((220-loc.y)/21)))])};handle.onpointerup=e=>{if(!start||correct)return;const old=start;start=null;if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);if(!samePoint(old,dragPoints[i]))finishDrag(i,old)};handle.onpointercancel=()=>{if(start){moveHandle(i,start);start=null}};handle.onkeydown=e=>{if(correct)return;const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(delta){e.preventDefault();moveHandle(i,dragPoints[i].map((v,j)=>Math.max(-10,Math.min(10,v+delta[j]))))}else if(e.key==='Enter'||e.key===' '){e.preventDefault();document.getElementById('check').focus()}}})}function streakGoal(){return session&&session.topic===3&&session.level<=2?3:5}function perProblemForgiveness(){return session&&(((session.topic===1||session.topic===2)&&session.level===2)||(session.topic===3))}function recordMistake(){if(perProblemForgiveness()){session.problemErrors=(session.problemErrors||0)+1;const reset=session.problemErrors>1;if(reset)session.count=0;return reset}session.errors++;const reset=session.errors>(session.topic===0||session.level===1||(session.topic===1&&session.level===3)?0:1);if(reset){session.count=0;session.errors=0}return reset}function updateStreak(){const stars=document.getElementById('streakStars');if(!stars)return;stars.innerHTML=Array.from({length:streakGoal()},(_,i)=>`<span class="${i<session.count?'filled':''}" aria-hidden="true">${i<session.count?'★':'☆'}</span>`).join('');stars.setAttribute('aria-label',session.count+' out of '+streakGoal()+' stars filled');document.getElementById('streakPolicy').textContent=perProblemForgiveness()?((session.problemErrors||0)===0?'One incorrect check is forgiven on this problem.':'The forgiven mistake on this problem is used. Another incorrect check resets your streak.'):session.topic===0?'Concept 1: every mistake resets your streak.':session.topic===1&&session.level===3?'Every incorrect answer resets your streak.':session.level===1?'Level 1: a mistake resets your streak.':session.errors===0?'Levels 2 & 3: one mistake is forgiven per streak.':'Your one forgiven mistake is used. The next mistake resets your streak.'}function check(){if(correct)return;let ok=false;const feedback=document.getElementById('feedback');if(q.mode==='choice'){if(choice===null){feedback.textContent='Choose a transformation first.';return}ok=q.options[choice]===q.answer}else if(q.mode==='rotationRule'){const x=document.getElementById('ruleX').value,y=document.getElementById('ruleY').value;if(!x.trim()||!y.trim()){feedback.textContent='Enter an expression in each box first.';return}const expected=q.t.kind==='r270'?['y','-x']:q.t.kind==='r90'?['-y','x']:['-x','-y'];ok=normalizeRotationExpression(x)===expected[0]&&normalizeRotationExpression(y)===expected[1]}else if(q.mode==='translationRule'){const x=document.getElementById('ruleX').value,y=document.getElementById('ruleY').value;if(!x.trim()||!y.trim()){feedback.textContent='Enter an expression in each box first.';return}ok=matchesExpression(x,'x',q.t.dx)&&matchesExpression(y,'y',q.t.dy)}else if(q.mode==='point'){const x=document.getElementById('x0').value,y=document.getElementById('y0').value;if(x===''||y===''){feedback.textContent='Enter both coordinates first.';return}ok=samePoint([+x,+y],q.target[0])}else{let points=[];for(let i=0;i<3;i++){let x=document.getElementById('x'+i).value,y=document.getElementById('y'+i).value;if(x===''||y===''){feedback.textContent='Enter all three image points first.';return}points.push([+x,+y])}const eq=(a,b)=>a[0]===b[0]&&a[1]===b[1];ok=q.mode==='plot'&&session.level===1&&!isDrag()?q.target.every(v=>points.some(p=>eq(v,p)))&&new Set(points.map(JSON.stringify)).size===3:points.every((v,i)=>eq(v,q.target[i]));if(q.mode==='coords'){const v=document.getElementById('rule').value;if(v===''){feedback.textContent='Choose a coordinate rule, too.';return}ok=ok&&q.rules[+v]===rule(q.t)}}if(isDrag()&&session.level===2)ok=ok&&dragPoints.every((p,i)=>samePoint(p,q.target[i]));if(isDrag()&&dragResult){dragResult.pending=false;dragResult.ok=ok;refreshGrid()}if(!ok){feedback.style.color='var(--pink)';const reset=recordMistake();updateStreak();feedback.textContent=(reset?'Your streak reset. Let’s start filling those stars again! ':'One mistake forgiven — your stars stay! The next mistake resets the streak. ')+(isDrag()&&session.level===2?'Check both the dragged points and the typed coordinates, then try again.':'Check your move and try again.');return}correct=true;session.count++;updateStreak();feedback.style.color='var(--mint)';feedback.textContent=pick(['Perfect footwork! ✦','That move deserves applause! ✦','You nailed the choreography! ✦'])+' '+session.count+' / '+streakGoal()+' stars filled.';document.getElementById('check').disabled=true;app.querySelectorAll('input,select').forEach(v=>v.disabled=true);advanceTimer=setTimeout(()=>{if(session.count>=streakGoal())celebrate();else next()},1400)}
function celebrate(){const{topic,level}=session;state.done[topic]=Math.max(state.done[topic],level);save();document.getElementById('paddle').textContent=level+7;const judgeName=['Carrie Ann','Derek','Bruno'][level-1];document.getElementById('judgeScene').className='judge-scene judge-'+level;document.querySelector('#judgeScene img').alt=judgeName+' holding a '+(level+7)+' score paddle';document.getElementById('awardTitle').textContent=level===3?'Mirror ball champion!':'A '+(level+7)+' from '+judgeName+'!';document.getElementById('awardText').textContent=level===3?'Bruno awards a 10! You mastered all three levels of '+TOPICS[topic]+'. Take a bow!':streakGoal()+' winning moves! Level '+(level+1)+' is now unlocked for '+TOPICS[topic]+'.';document.getElementById('trophy').innerHTML=level===3?'<div class="ball" style="width:100px;height:100px"></div><div class="trophy">🏆</div><p>Your mirror ball trophy</p>':'';const dialog=document.getElementById('award');dialog.showModal();document.getElementById('awardNext').textContent=level<3?'Dance into Level '+(level+1):'Back to the rubric';document.getElementById('awardNext').onclick=()=>{dialog.close();if(level<3)start(topic,level+1);else home()};dialog.oncancel=()=>{home()};if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<90;i++){let c=document.createElement('i');c.className='confetti';c.style.left=rand(0,100)+'vw';c.style.background=pick(['#f8d787','#f39ec5','#79e2d1','#b8a8ff']);c.style.setProperty('--drift',rand(-180,180)+'px');c.style.animationDelay=Math.random()*.7+'s';document.body.append(c);setTimeout(()=>c.remove(),4000)}}home();
</script></body></html>
