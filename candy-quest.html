function svg(s){return `<div class="diagram"><svg viewBox="0 0 520 270" role="img" aria-label="Geometry diagram for the question">${s}</svg></div>`}function txt(x,y,s){return `<text x="${x}" y="${y}">${s}</text>`}function numeric(prompt,answer,diagram,hint){return {prompt,answer,diagram,hint}}function choose(prompt,choices,answer,diagram,hint){return {prompt,choices,answer,diagram,hint}}
function transformationGraph(original,final,middle){
const lo=-8,hi=10,step=24,offset=40,size=(hi-lo)*step,px=x=>offset+(x-lo)*step,py=y=>offset+(hi-y)*step;
let grid='';for(let i=lo;i<=hi;i++){grid+=`<line x1="${px(i)}" y1="${offset}" x2="${px(i)}" y2="${offset+size}" style="stroke:#ddd2e1;stroke-width:1"/><line x1="${offset}" y1="${py(i)}" x2="${offset+size}" y2="${py(i)}" style="stroke:#ddd2e1;stroke-width:1"/>`;if(i%2===0&&i!==0)grid+=`<text x="${px(i)}" y="${py(0)+17}" text-anchor="middle" style="font-size:11px">${i}</text><text x="${px(0)-10}" y="${py(i)+4}" text-anchor="end" style="font-size:11px">${i}</text>`}
function poly(points,names,color,dash){return `<polygon points="${points.map(([x,y])=>[px(x),py(y)].join(',')).join(' ')}" style="fill:${color}22;stroke:${color};stroke-width:3;${dash?'stroke-dasharray:6 4;':''}"/>${points.map(([x,y],i)=>`<text x="${px(x)+7}" y="${py(y)-8}" style="fill:${color};font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff9ee;stroke-width:3">${names[i]}</text>`).join('')}`}
return `<div class="diagram"><svg style="max-height:560px" viewBox="0 0 520 520" role="img" aria-label="Coordinate graph: original triangle ABC in purple and image JKL in teal${middle?', intermediate triangle in dashed orange':''}. One grid square is one unit.">${grid}<line x1="${offset}" y1="${py(0)}" x2="${offset+size+12}" y2="${py(0)}" style="stroke:#493054;stroke-width:2"/><line x1="${px(0)}" y1="${offset+size}" x2="${px(0)}" y2="${offset-12}" style="stroke:#493054;stroke-width:2"/><text x="${offset+size+18}" y="${py(0)+5}">x</text><text x="${px(0)+8}" y="${offset-15}">y</text>${poly(original,['A','B','C'],'#743a9e')}${middle?poly(middle,["A′","B′","C′"],'#bc6200',true):''}${poly(final,['J','K','L'],'#087b7b')}</svg><p style="color:#493054;margin:6px;text-align:center;font-size:13px">Purple: ABC · Teal: JKL${middle?' · Dashed orange: after the first transformation':''}<br>Each grid square = 1 unit.</p></div>`}
const RAD=Math.PI/180;
const vadd=(a,b)=>[a[0]+b[0],a[1]+b[1]],vsub=(a,b)=>[a[0]-b[0],a[1]-b[1]],vmul=(a,k)=>[a[0]*k,a[1]*k];
const unit=a=>vmul(a,1/Math.hypot(...a));
function angleDegrees(p,v,r){const a=unit(vsub(p,v)),b=unit(vsub(r,v));return Math.acos(Math.max(-1,Math.min(1,a[0]*b[0]+a[1]*b[1])))/RAD}
function geoText(p,label,size=18){return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" style="font-size:${size}px;font-weight:600;paint-order:stroke;stroke:#fff9ee;stroke-width:4px;stroke-linejoin:round">${label}</text>`}
function geoLine(a,b,style=''){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="${style}"/>`}
function geoPolygon(points){return `<polygon points="${points.map(p=>p.join(',')).join(' ')}"/>`}
function geoWrap(body,description='Figure drawn to match the angle measures.',height=400){return `<div class="diagram"><svg viewBox="0 0 560 ${height}" style="max-height:${height+30}px;aspect-ratio:560/${height};height:auto" role="img" aria-label="${description}">${body}</svg></div>`}
function fitGeometry(points){const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),scale=Math.min(360/(maxx-minx||1),230/(maxy-miny||1)),cx=(minx+maxx)/2,cy=(miny+maxy)/2;return points.map(([x,y])=>[280+(x-cx)*scale,200+(y-cy)*scale])}
function trianglePoints(a,b){const c=180-a-b,len=Math.sin(b*RAD)/Math.sin(c*RAD);return [[0,0],[1,0],[len*Math.cos(a*RAD),-len*Math.sin(a*RAD)]]}
function insideTriangle(p,points){const signs=points.map((a,i)=>{const b=points[(i+1)%3];return (b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0])});return signs.every(v=>v>=-.1)||signs.every(v=>v<=.1)}
function angleMark(v,p,r,label,options={}){const a=unit(vsub(p,v)),b=unit(vsub(r,v)),bis=unit(vadd(a,b)),degrees=angleDegrees(p,v,r),arcRadius=options.radius||22,start=vadd(v,vmul(a,arcRadius)),end=vadd(v,vmul(b,arcRadius)),cross=a[0]*b[1]-a[1]*b[0];let arc;

const fromRight=Math.random()<.5,source=fromRight?right:left,target=fromRight?left:right,isAngle=Math.random()<.5,index=ri(0,n-1);

if(c===1){if(l===0){const vertical=angleQuestionCount++%2===0;
const givenIndex=ri(0,3),targetIndex=(givenIndex+(vertical?2:pick([1,3])))%4,obtuse=ri(105,150),given=givenIndex%2===0?obtuse:180-obtuse,labels=Array(4).fill(null);labels[givenIndex]=given+'°';labels[targetIndex]='?';const diagram=crossingFigure(obtuse,labels);

function start(i){if(i%3&&!state.done[i-1])return;active=i;busy=false;renderQuestion()}function renderQuestion(){q=generate(Math.floor(active/3),active%3);busy=false;selected=[];total();app.innerHTML=`<div class="practice"><div class="topline"><button onclick="home()">← Progress ladder</button><span class="pill">Concept ${Math.floor(active/3)+1} · Level ${active%3+1}</span></div><div class="panel"><div class="eyebrow">Five in a row earns your candy</div><h2>${titles[Math.floor(active/3)]}</h2><div class="streak" aria-label="${state.streak[active]} out of 5 correct">${Array.from({length:5},(_,i)=>`<span class="sweet ${i<state.streak[active]?'on':''}">🍬</span>`).join('')}</div><p>${rubric[Math.floor(active/3)][active%3]}</p><h2 style="font-size:21px">${q.prompt}</h2><p style="font-size:12px">${q.coordinateGraph?'Use the coordinate grid to compare corresponding vertices.':q.multi?'Compare the shapes as drawn. Turning a shape does not change its size.':'Figures are drawn to match the angle measures. Use angle relationships to find exact answers.'}</p>${q.diagram||''}${q.multi?`<div class="choices">${q.choices.map(v=>`<button type="button" class="shape-choice" aria-pressed="false" onclick="toggleShape('${v}',this)">Shape ${v}</button>`).join('')}</div><p id="selection-count" aria-live="polite">Choose 2 shapes (0 selected).</p><button id="check-pair" class="primary" disabled onclick="check(selected)">Check answer</button>`:q.choices?`<div class="choices">${shuffle(q.choices).map((v,i)=>`<button data-option="${i}"></button>`).join('')}</div>`:`<form id="answerform" class="answerline"><input id="answer" aria-label="Your answer" inputmode="decimal" autocomplete="off" placeholder="Enter your answer" required><button class="primary">Check answer</button></form>`}<div class="feedback" id="feedback" aria-live="polite"></div><button id="next" hidden onclick="renderQuestion()">Try a new question →</button><details><summary>Scratch board</summary><p style="font-size:12px">Draw with function toggleShape(letter,button){if(busy)return;if(selected.includes(letter))selected=selected.filter(v=>v!==letter);else if(selected.length<2)selected.push(letter);document.querySelectorAll('.shape-choice').forEach(el=>el.setAttribute('aria-pressed',String(selected.includes(el.textContent.slice(-1)))));document.getElementById('selection-count').textContent=`Choose 2 shapes (${selected.length} selected).`;document.getElementById('check-pair').disabled=selected.length!==2}

function reward(){total();for(let i=0;i<65;i++){let e=document.createElement('span');e.className='candyfall';e.textContent=pick(['🍬','🍭','🍫']);e.style.left=ri(0,98)+'vw';e.style.animationDelay=Math.random()*.7+'s';e.style.setProperty('--drift',ri(-140,140)+'px');document.body.append(e);setTimeout(()=>e.remove(),3700)}let next=active%3<2;app.innerHTML=`<div class="practice panel reward"><div class="big">🎃🍭</div><div class="eyebrow">Five in a row!</div><h1 style="font-size:46px">Candy collected!</h1><p>You completed Concept ${Math.floor(active/3)+1}, Level ${active%3+1}.${next?' The next level is now unlocked.':' You finished every level in this concept!'}</p><div class="pills" style="justify-content:center">${next?`<button class="primary" onclick="start(${active+1})">Start Level ${active%3+2} →</button>`:''}<button onclick="home()">Back to progress ladder</button></div></div>`}
function board(){let c=document.getElementById('scratch'),ctx=c.getContext('2d'),drawing=false;ctx.lineWidth=3;ctx.lineCap='round';function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(drawing){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=c.onpointercancel=()=>drawing=false}function clearBoard(){let c=document.getElementById('scratch');c.getContext('2d').clearRect(0,0,c.width,c.height)}function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='candy-quest-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(file){if(!file)return;try{let s=JSON.parse(await file.text());if(!Array.isArray(s.done)||s.done.length!==15||!s.done.every(v=>typeof v==='boolean')||!Array.isArray(s.streak)||s.streak.length!==15||!s.streak.every(v=>Number.isInteger(v)&&v>=0&&v<=4)||s.done.some((v,i)=>v&&i%3>0&&!s.done[i-1]))throw Error();state=s;save();home()}catch{alert('Please choose a valid Candy Quest progress file.')}}home();
